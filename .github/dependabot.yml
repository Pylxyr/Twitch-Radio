version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      # yt-dlp's pinned companions move together; check them against `pip show yt-dlp` before merging.
      yt-dlp:
        patterns: [yt-dlp, brotli, certifi, mutagen, pycryptodomex, requests, urllib3, websockets, curl-cffi]
  - package-ecosystem: npm
    directory: /gui
    schedule:
      interval: weekly
