name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Formats the code with the ruff version pinned in requirements-dev.txt and
  # commits the result back to the branch, so a formatting slip never fails CI.
  # Skipped for fork PRs (no write access); the `python` job's
  # `ruff format --check` below still enforces formatting there.
  #
  # Commits pushed with the default GITHUB_TOKEN do not start a new workflow
  # run. That is fine here, because the `python` job below checks out the
  # formatted branch tip and tests it in this same run. If you require status
  # checks on PRs, add a PAT or GitHub App token as the AUTOFORMAT_TOKEN
  # secret and the bot commit will get its own CI run too.
  autoformat:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.AUTOFORMAT_TOKEN || github.token }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the pinned ruff
        run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"
      - run: ruff format .
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "style: ruff format"
          git push

  python:
    needs: autoformat
    # Run when autoformat succeeded or was skipped (fork PRs), never when it failed.
    if: ${{ !cancelled() && (needs.autoformat.result == 'success' || needs.autoformat.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pick up the commit autoformat may have just pushed.
          ref: ${{ needs.autoformat.result == 'success' && (github.head_ref || github.ref_name) || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*
      - run: pip install -r requirements-dev.txt -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy twitch_radio bot.py
      - run: pytest -q

  # The release builds install from requirements-build.lock with hash checking. This fails
  # when requirements*.txt changed without the lock being regenerated (command in the lock's header).
  build-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install uv==0.12.23
      - name: Lock is up to date
        run: |
          cp requirements-build.lock /tmp/before.lock
          uv pip compile requirements-build.txt --universal --python-version 3.11 --generate-hashes --no-header -o /tmp/after.lock
          # Compare everything except the comment header.
          diff <(grep -v '^#' /tmp/before.lock) <(grep -v '^#' /tmp/after.lock) \
            || { echo "::error::requirements-build.lock is out of date. Regenerate it (see its header)."; exit 1; }

  electron:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gui
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1" # lint and config checks never start Electron
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run check:build

  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -Eq '^(twitch_radio/|packaging/|gui/|requirements[^/]*\.txt$|scripts/smoke_core\.py$|scripts/check_ffmpeg\.py$|tests/fixtures/audio/|\.github/workflows/ci\.yml$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  ffmpeg:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.build == 'true'
    uses: ./.github/workflows/ffmpeg.yml

  windows-build-smoke:
    needs: [changes, ffmpeg]
    if: github.event_name == 'pull_request' && needs.changes.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*
      - run: pip install --require-hashes -r requirements-build.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-windows-x64
          path: packaging/bin
      - name: Check the trimmed ffmpeg with Schannel and the Windows certificate store
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          pip install trustme==1.2.1
          python scripts/check_ffmpeg.py packaging/bin/ffmpeg.exe --require-tls --https-url "https://raw.githubusercontent.com/${{ github.repository }}/$env:SHA/tests/fixtures/audio/tone.webm"
      - name: Build the core with PyInstaller
        run: pyinstaller packaging/core.spec --noconfirm --distpath dist/core --workpath build/pyinstaller
      - name: Smoke test the frozen core
        run: |
          $node = (Get-Command node).Source
          python scripts/smoke_core.py --exe dist/core/TwitchRadioCore/TwitchRadioCore.exe --bin packaging/bin --host-js $node
      - name: Real YouTube resolve + JS solver download (needs the network; may fail on a PR)
        continue-on-error: true
        run: |
          $node = (Get-Command node).Source
          python scripts/smoke_core.py --exe dist/core/TwitchRadioCore/TwitchRadioCore.exe --bin packaging/bin --resolve-only --host-js $node

  linux-build-smoke:
    needs: [changes, ffmpeg]
    if: github.event_name == 'pull_request' && needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*
      - run: pip install --require-hashes -r requirements-build.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-linux-x64
          path: packaging/bin
      - run: chmod +x packaging/bin/ffmpeg
      - name: Build the core with PyInstaller
        run: pyinstaller packaging/core.spec --noconfirm --distpath dist/core --workpath build/pyinstaller
      - name: Smoke test the frozen core
        run: python scripts/smoke_core.py --exe dist/core/TwitchRadioCore/TwitchRadioCore --bin packaging/bin --host-js "$(command -v node)"
      - name: Real YouTube resolve + JS solver download (needs the network; may fail on a PR)
        continue-on-error: true
        run: python scripts/smoke_core.py --exe dist/core/TwitchRadioCore/TwitchRadioCore --bin packaging/bin --resolve-only --host-js "$(command -v node)"
