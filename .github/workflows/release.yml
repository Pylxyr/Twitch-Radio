name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Dry run: version to build, as in package.json (e.g. 1.1.0 or 1.1.0-rc1). Builds and uploads artifacts; publishes nothing."
        required: true
  # Called by cut-release.yml (the one-click release). A tag pushed with the default
  # GITHUB_TOKEN does not start workflows, so that workflow calls this one directly.
  workflow_call:
    inputs:
      tag:
        description: "Existing tag to build and publish, e.g. v1.1.0"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version-guard:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      # Empty (the triggering ref) for a tag push or a dry run; the new tag when called.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          CALLED_TAG: ${{ inputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$CALLED_TAG" ]; then TAG="$CALLED_TAG"
          elif [ "$EVENT" = "workflow_dispatch" ]; then TAG="v${INPUT_VERSION#v}"
          else TAG="$REF_NAME"; fi
          python3 scripts/bump-version.py --check "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: version-guard
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    env:
      VERSION: ${{ needs.version-guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: pip install -r requirements-build.txt
      - name: Fetch ffmpeg and Deno (pinned, checksum-verified)
        shell: pwsh
        run: ./packaging/fetch-tools.ps1
      - name: Build the core with PyInstaller
        run: pyinstaller packaging/core.spec --noconfirm --distpath dist/core --workpath build/pyinstaller
      - name: Smoke test the frozen core
        run: python scripts/smoke_core.py --exe dist/core/TwitchRadioCore/TwitchRadioCore.exe --bin packaging/bin
      # Best effort. YouTube routinely answers GitHub-hosted runners with "Sign in to confirm you're not a
      # bot", which says nothing about the build, so a failure here is a warning and does not stop the
      # release. The frozen-core checks above stay required. After a release, play one link from the
      # installed app to confirm YouTube works end to end.
      - name: Real YouTube resolve + JS solver download (best effort)
        id: live-resolve
        continue-on-error: true
        run: python scripts/smoke_core.py --exe dist/core/TwitchRadioCore/TwitchRadioCore.exe --bin packaging/bin --resolve-only
      - name: Flag a failed live YouTube check
        if: steps.live-resolve.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning title=Live YouTube check failed::YouTube refused the CI runner or the JS solver could not be downloaded. The release was not blocked. Try one link in the installed app."
          {
            echo "### Live YouTube check failed (release not blocked)"
            echo "YouTube often blocks GitHub-hosted runners. Install the build and play one link to confirm."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install GUI dependencies
        working-directory: gui
        run: npm ci
      - name: Check the electron-builder config and build inputs
        working-directory: gui
        run: npm run check:build -- --require-built
      - name: Detect code-signing secrets
        id: sign
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$WIN_CSC_LINK" ] && [ -n "$WIN_CSC_KEY_PASSWORD" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD not set: building an unsigned installer."
          fi
      - name: Build the installer (signed)
        if: steps.sign.outputs.signed == 'true'
        working-directory: gui
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run dist
      - name: Build the installer (unsigned)
        if: steps.sign.outputs.signed != 'true'
        working-directory: gui
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist
      - name: Collect release files
        shell: pwsh
        run: |
          $built = "dist/app/Twitch Radio Setup $env:VERSION.exe"
          if (-not (Test-Path $built)) { throw "Installer not found: $built" }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          # GitHub turns spaces in asset names into dots; name the file as users will receive it.
          Copy-Item $built "release/Twitch.Radio.Setup.$env:VERSION.exe"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: release/*
          if-no-files-found: error

  build-linux:
    needs: version-guard
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version-guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: pip install -r requirements-build.txt
      - name: Fetch ffmpeg and Deno (pinned, checksum-verified)
        run: bash packaging/fetch-tools.sh
      - name: Build the core with PyInstaller
        run: pyinstaller packaging/core.spec --noconfirm --distpath dist/core --workpath build/pyinstaller
      - name: Smoke test the frozen core
        run: python scripts/smoke_core.py --exe dist/core/TwitchRadioCore/TwitchRadioCore --bin packaging/bin
      # Best effort, like the Windows job: YouTube often refuses GitHub-hosted runners.
      - name: Real YouTube resolve + JS solver download (best effort)
        id: live-resolve
        continue-on-error: true
        run: python scripts/smoke_core.py --exe dist/core/TwitchRadioCore/TwitchRadioCore --bin packaging/bin --resolve-only
      - name: Flag a failed live YouTube check
        if: steps.live-resolve.outcome == 'failure'
        run: |
          echo "::warning title=Live YouTube check failed (Linux)::YouTube refused the CI runner or the JS solver could not be downloaded. The release was not blocked."
      - name: Install GUI dependencies
        working-directory: gui
        run: npm ci
      - name: Check the electron-builder config and build inputs
        working-directory: gui
        run: npm run check:build -- --require-built
      - name: Build the AppImage and tarball
        working-directory: gui
        run: npm run dist:linux
      - name: Collect release files
        run: |
          mkdir -p release
          for ext in AppImage tar.gz; do
            f="dist/app/Twitch-Radio-${VERSION}-linux-x64.${ext}"
            test -f "$f" || { echo "Not found: $f"; exit 1; }
            cp "$f" release/
          done
          ls -la release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux
          path: release/*
          if-no-files-found: error

  publish:
    needs: [version-guard, build, build-linux]
    # A tag push, or a call from cut-release.yml. A manual dry run has neither.
    if: github.event_name == 'push' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.version-guard.outputs.tag }}
      VERSION: ${{ needs.version-guard.outputs.version }}
      SIGNED: ${{ needs.build.outputs.signed }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Checksums and notices
        run: |
          cp THIRD_PARTY_NOTICES.txt release/
          cd release
          sha256sum Twitch.Radio.Setup.*.exe Twitch-Radio-*-linux-x64.* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # Needs a public repo, or GitHub Enterprise Cloud for a private one. Never blocks the release.
      - name: Attest build provenance
        id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/Twitch.Radio.Setup.*.exe
            release/Twitch-Radio-*-linux-x64.*
      - name: Write release notes
        env:
          # Optional. With this secret set, Claude reads the code changes and writes the notes;
          # without it the notes come from commit messages and a static read of the code.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          {
            cat .github/release-notes-header.md
            echo
            # What changed since the previous release: an AI summary if a key is set, otherwise grouped
            # commit messages plus what the code shows for vague messages like "Add files via upload".
            python3 scripts/release_notes.py --ai --tag "$TAG" --repo "$GITHUB_REPOSITORY" || {
              echo "::warning::Could not build the changelog; publishing without it." >&2
              echo "See the commit history for what changed."
            }
            echo
            echo "## About these builds"
            echo
            if [ "$SIGNED" = "true" ]; then
              echo "The Windows installer is code-signed."
            else
              echo "The Windows installer is **not code-signed**, so SmartScreen will warn about it."
            fi
            echo "The Linux builds are not signed; check them against \`SHA256SUMS.txt\`."
            if [ "${{ steps.attest.outcome }}" = "success" ]; then
              echo "Build provenance: verify with \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`."
            fi
          } > notes.md
          cat notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Create the GitHub release
        run: |
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" \
            "release/Twitch.Radio.Setup.${VERSION}.exe#Twitch Radio Setup ${VERSION}.exe" \
            "release/Twitch-Radio-${VERSION}-linux-x64.AppImage" \
            "release/Twitch-Radio-${VERSION}-linux-x64.tar.gz" \
            release/SHA256SUMS.txt \
            release/THIRD_PARTY_NOTICES.txt \
            --title "Twitch Radio ${VERSION}" \
            --notes-file notes.md \
            --verify-tag \
            "${flags[@]}"
